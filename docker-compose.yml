services:
  backend:
    build: ./backend
    ports:
      - "8998:8998"
    volumes:
      - ./data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/portfolio.db
      - CORS_ORIGINS=*

  frontend:
    build: ./frontend
    ports:
      - "3333:3000"
    depends_on:
      - backend
